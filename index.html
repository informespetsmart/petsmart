<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetSmart | Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .bg-yape { background-color: #7424b3; }
    </style>
</head>
<body x-data="shop">

    <nav class="sticky top-0 z-[200] bg-white/80 backdrop-blur-md border-b border-slate-100 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-[1000] italic uppercase tracking-tighter">
                Pet<span class="text-indigo-600">Smart</span>
            </h1>
            <button @click="cartOpen = true" class="relative p-2 bg-slate-900 text-white rounded-2xl shadow-lg active:scale-90 transition-all">
                <i class="fa-solid fa-bag-shopping"></i>
                <span x-show="cart.length > 0" x-text="cart.length" class="absolute -top-2 -right-2 bg-indigo-500 text-[10px] w-5 h-5 flex items-center justify-center rounded-full border-2 border-white"></span>
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <template x-for="p in products" :key="p.id">
                <div @click="window.location.href='transportadores.html'" class="bg-white p-6 rounded-[45px] border border-slate-100 shadow-sm hover:shadow-xl transition-all cursor-pointer group">
                    <div class="aspect-square mb-6 overflow-hidden rounded-[35px] bg-slate-50 flex items-center justify-center p-8">
                        <img :src="p.variants[0].imagenColor" class="w-full h-full object-contain group-hover:scale-110 transition-transform duration-500">
                    </div>
                    <h3 class="text-xl font-black italic uppercase tracking-tighter text-slate-950" x-text="p.name"></h3>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mt-2">Ver modelos disponibles</p>
                </div>
            </template>
        </div>
    </main>

    <div x-show="cartOpen" class="fixed inset-0 z-[300]" x-cloak>
        <div x-show="cartOpen" x-transition.opacity class="absolute inset-0 bg-slate-950/40 backdrop-blur-sm" @click="cartOpen = false"></div>

        <div class="absolute inset-y-0 right-0 w-full max-w-md bg-white flex flex-col shadow-[-20px_0_50px_rgba(0,0,0,0.1)]"
             x-show="cartOpen" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0">
            
            <div class="p-6 pb-8 border-b border-slate-900 flex flex-col items-center relative bg-slate-950 text-white overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-full opacity-10">
                    <i class="fa-solid fa-paw absolute -top-5 -left-5 text-[120px] rotate-12"></i>
                </div>
                <div class="mb-6 flex flex-col items-center relative z-10">
                    <span class="text-[9px] font-[1000] text-indigo-400 uppercase tracking-[0.4em] mb-3 animate-pulse">¡Queda poco tiempo!</span>
                    <div class="bg-indigo-600/10 border border-indigo-500/30 px-5 py-2 rounded-full flex items-center gap-4 backdrop-blur-md">
                        <i class="fa-solid fa-dog text-indigo-400 animate-bounce text-xs"></i>
                        <span class="text-xl font-black tracking-[0.2em] text-white tabular-nums" x-text="countdown.m + ':' + countdown.s"></span>
                        <i class="fa-solid fa-cat text-indigo-400 animate-bounce text-xs"></i>
                    </div>
                </div>
                <div class="text-center relative z-10">
                    <h2 class="text-2xl font-[1000] italic uppercase tracking-tighter leading-none mb-3">Pet<span class="text-indigo-600">Smart</span></h2>
                    <p class="text-[9px] font-light text-slate-500 uppercase tracking-[0.4em] mt-4">Mi Carrito</p>
                </div>
                <button @click="cartOpen = false" class="absolute top-4 right-4 w-8 h-8 rounded-full border border-slate-800 flex items-center justify-center text-slate-500 hover:text-white">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>

            <div class="flex-1 p-8 overflow-y-auto space-y-4 scrollbar-hide bg-slate-50/20">
                <template x-for="(item, index) in cart" :key="index">
                    <div class="bg-white p-5 rounded-[35px] flex items-center gap-5 border border-slate-100 shadow-sm transition-all hover:scale-[1.02]">
                        <div class="w-20 h-20 bg-slate-50 rounded-3xl flex items-center justify-center p-3">
                            <img :src="item.imagenColor" class="w-full h-full object-contain" />
                        </div>
                        <div class="flex-1">
                            <p class="text-[12px] font-black text-slate-900 uppercase italic" x-text="item.name"></p>
                            <p class="text-[9px] font-bold text-indigo-500 uppercase tracking-widest mt-1" x-text="item.selectedColorName"></p>
                            <div class="flex items-center gap-3 mt-3 bg-slate-100 w-fit rounded-full px-2 py-1 border border-slate-200">
                                <button @click="updateQuantity(index, 'minus')" class="w-7 h-7 flex items-center justify-center bg-white rounded-full shadow-sm font-black active:scale-90"><i class="fa-solid fa-minus scale-75"></i></button>
                                <span class="text-[12px] font-black text-slate-800 min-w-[24px] text-center" x-text="item.quantity"></span>
                                <button @click="updateQuantity(index, 'plus')" class="w-7 h-7 flex items-center justify-center bg-white rounded-full shadow-sm font-black active:scale-90"><i class="fa-solid fa-plus scale-75"></i></button>
                            </div>
                            <p class="text-lg font-black mt-2 text-slate-950 italic" x-text="'S/ ' + (item.price * item.quantity).toFixed(2)"></p>
                        </div>
                        <button @click="removeFromCart(index)" class="text-slate-200 hover:text-rose-500 px-4"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </template>

                <div x-show="cart.length > 0" class="mt-10 space-y-3 bg-white p-8 rounded-[45px] border border-slate-100 shadow-inner">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] text-center mb-4 italic">Detalles de Entrega</p>
                    <select x-model="selectedDistrito" @change="handleLocationChange('distrito')" class="w-full bg-slate-50 border-none rounded-2xl p-4 text-xs font-black text-slate-700 outline-none ring-1 ring-slate-100 focus:ring-indigo-500 transition-all uppercase">
                        <option value="">Distrito...</option>
                        <template x-for="d in distritos" :key="d.nombre"><option :value="d.nombre" x-text="d.nombre"></option></template>
                    </select>
                    <select x-model="selectedEstacion" @change="handleLocationChange('estacion')" class="w-full bg-slate-50 border-none rounded-2xl p-4 text-xs font-black text-slate-700 outline-none ring-1 ring-slate-100 focus:ring-indigo-500 transition-all uppercase">
                        <option value="">Estación del Tren...</option>
                        <template x-for="e in estaciones" :key="e.nombre"><option :value="e.nombre" x-text="e.nombre"></option></template>
                    </select>
                    <input type="date" x-model="deliveryDate" :min="minDate" class="w-full bg-slate-50 border-none rounded-2xl p-4 text-xs font-black text-slate-700 ring-1 ring-slate-100 focus:ring-indigo-500 outline-none transition-all" />
                </div>
            </div>

            <div class="p-6 bg-white border-t border-slate-50" x-show="cart.length > 0">
                <div class="space-y-1.5 mb-5">
                    <div class="flex justify-between text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                        <span>Subtotal</span>
                        <span class="text-slate-900" x-text="'S/ ' + subtotal"></span>
                    </div>
                    <div class="flex justify-between text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                        <span>Envío</span>
                        <span class="text-indigo-500" x-text="'S/ ' + costoEnvio"></span>
                    </div>
                    <div class="pt-3 flex justify-between items-baseline border-t border-slate-100">
                        <span class="text-[11px] font-black text-slate-950 uppercase tracking-widest">Total Final</span>
                        <span class="text-2xl font-[1000] italic text-slate-950 tracking-tighter" x-text="'S/ ' + total"></span>
                    </div>
                </div>
                <div class="grid grid-cols-1 gap-2">
                    <button @click="qrYapeOpen = true" :disabled="!isReady" :class="isReady ? 'bg-[#7424b3] shadow-lg shadow-purple-100' : 'bg-slate-100 text-slate-400 cursor-not-allowed'" class="w-full text-white py-3 rounded-2xl font-black text-[10px] uppercase tracking-[0.2em] active:scale-95 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-qr-code text-[10px]"></i> Pagar con Yape
                    </button>
                    <button @click="sendWhatsApp" :disabled="!isReady" :class="isReady ? 'bg-slate-950 shadow-xl shadow-slate-200' : 'bg-slate-100 text-slate-400 cursor-not-allowed'" class="w-full text-white py-3 rounded-2xl font-black text-[10px] uppercase tracking-[0.2em] active:scale-95 transition-all flex items-center justify-center gap-2">
                        <i class="fa-brands fa-whatsapp text-xs"></i> Confirmar WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div x-show="qrYapeOpen" class="fixed inset-0 z-[400] flex items-center justify-center p-6" x-transition.opacity x-cloak>
        <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-xl" @click="qrYapeOpen = false"></div>
        <div class="bg-white w-full max-w-sm rounded-[45px] overflow-hidden relative shadow-3xl p-10 text-center">
            <h3 class="text-2xl font-black text-slate-950 italic tracking-tighter uppercase mb-4">Pago con Yape</h3>
            <div class="bg-slate-50 border border-slate-100 rounded-[40px] p-8 mb-4 shadow-inner">
                <img src="URL_DE_TU_QR_AQUI" class="w-full aspect-square object-contain mix-blend-multiply" />
            </div>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Número de celular</p>
            <p class="text-3xl font-black text-slate-950 tracking-widest mb-4">984 464 009</p>
            <p class="text-5xl font-black italic text-slate-950" x-text="'S/ ' + total"></p>
            <button @click="sendWhatsApp" class="mt-6 w-full bg-[#25d366] text-white py-5 rounded-[22px] font-black text-xs uppercase tracking-widest shadow-xl active:scale-95 transition-all">Enviar Comprobante</button>
        </div>
    </div>

<script>
    document.addEventListener("alpine:init", () => {
        Alpine.data("shop", () => ({
            cartOpen: false,
            qrYapeOpen: false,
            // Carga inicial desde localStorage
            cart: JSON.parse(localStorage.getItem('cart')) || [],
            selectedDistrito: localStorage.getItem('selectedDistrito') || "",
            selectedEstacion: localStorage.getItem('selectedEstacion') || "",
            deliveryDate: localStorage.getItem('deliveryDate') || "",
            
            countdown: { m: '20', s: '00' },
            costoEnvio: 0,
            subtotal: 0,
            total: 0,
            minDate: "",
            
            distritos: [
                { nombre: "Miraflores", envio: 10 },
                { nombre: "Surco", envio: 10 },
                { nombre: "S.J.M.", envio: 8 },
                { nombre: "VMT.", envio: 8 },
            ],
            estaciones: [
                { nombre: "Estación Angamos", envio: 5 },
                { nombre: "Estación Atocongo", envio: 5 },
                { nombre: "Estación La Cultura", envio: 5 },
            ],
            
            products: [
                { id: 1, name: "Transportadores", variants: [{ imagenColor: "https://via.placeholder.com/150" }] },
                { id: 2, name: "Rascadores", variants: [{ imagenColor: "https://via.placeholder.com/150" }] },
                { id: 3, name: "Comederos", variants: [{ imagenColor: "https://via.placeholder.com/150" }] },
                { id: 4, name: "Bebederos", variants: [{ imagenColor: "https://via.placeholder.com/150" }] },
                { id: 5, name: "Camas", variants: [{ imagenColor: "https://via.placeholder.com/150" }] },
                { id: 6, name: "Areneros", variants: [{ imagenColor: "https://via.placeholder.com/150" }] },
                { id: 7, name: "Accesorios", variants: [{ imagenColor: "https://via.placeholder.com/150" }] },
                { id: 8, name: "Alimento", variants: [{ imagenColor: "https://via.placeholder.com/150" }] }
            ],

            init() {
                // Configurar fecha mínima
                const now = new Date();
                if (now.getHours() >= 12) now.setDate(now.getDate() + 1);
                this.minDate = now.toISOString().split("T")[0];
                if(!this.deliveryDate) this.deliveryDate = this.minDate;

                // Observar cambios en el carrito para guardar y calcular
                this.$watch('cart', (val) => {
                    localStorage.setItem('cart', JSON.stringify(val));
                    this.calculateTotals();
                });

                // Carga inicial de totales y envío
                this.updateCostoEnvioManual();
                this.calculateTotals();
                this.setupTimer();
            },

            updateCostoEnvioManual() {
                if (this.selectedDistrito) {
                    const d = this.distritos.find(i => i.nombre === this.selectedDistrito);
                    this.costoEnvio = d ? d.envio : 0;
                } else if (this.selectedEstacion) {
                    const e = this.estaciones.find(i => i.nombre === this.selectedEstacion);
                    this.costoEnvio = e ? e.envio : 0;
                } else {
                    this.costoEnvio = 0;
                }
            },

            handleLocationChange(type) {
                if (type === "distrito") {
                    this.selectedEstacion = "";
                    localStorage.setItem('selectedEstacion', "");
                    localStorage.setItem('selectedDistrito', this.selectedDistrito);
                } else {
                    this.selectedDistrito = "";
                    localStorage.setItem('selectedDistrito', "");
                    localStorage.setItem('selectedEstacion', this.selectedEstacion);
                }
                this.updateCostoEnvioManual();
                this.calculateTotals();
            },

            calculateTotals() {
                // Forzamos que el subtotal sume correctamente
                this.subtotal = this.cart.reduce((sum, item) => {
                    const price = parseFloat(item.price) || 0;
                    return sum + (price * item.quantity);
                }, 0);
                this.total = this.subtotal + this.costoEnvio;
            },

            updateQuantity(index, action) {
                if (action === 'plus') this.cart[index].quantity++;
                else if (this.cart[index].quantity > 1) this.cart[index].quantity--;
                
                // Clonamos el array para que Alpine detecte el cambio profundo
                this.cart = [...this.cart];
            },

            removeFromCart(index) {
                this.cart.splice(index, 1);
                this.cart = [...this.cart];
            },

            setupTimer() {
                let segundosRestantes = 20 * 60;
                setInterval(() => {
                    if (segundosRestantes > 0) {
                        segundosRestantes--;
                        this.countdown.m = Math.floor(segundosRestantes / 60).toString().padStart(2, '0');
                        this.countdown.s = (segundosRestantes % 60).toString().padStart(2, '0');
                    }
                }, 1000);
            },

            get isReady() {
                return (this.selectedDistrito !== "" || this.selectedEstacion !== "") && this.cart.length > 0;
            },

            sendWhatsApp() {
                const texto = `Hola PetSmart, quiero confirmar mi pedido. Total: S/ ${this.total}`;
                window.open(`https://wa.me/51984464009?text=${encodeURIComponent(texto)}`, '_blank');
            }
        }));
    });
</script>
</body>
</html>
